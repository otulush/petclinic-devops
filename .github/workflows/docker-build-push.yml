name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "app"
      - ".github/workflows/docker-build-push.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "app"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/petclinic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - customers-service
          - vets-service
          - visits-service

    steps:
      - name: Checkout repository (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set image metadata
        id: meta
        run: |
          echo "git_commit_app=$(git -C app rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_commit_devops=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}:${{ steps.meta.outputs.git_commit_app }}
          build-args: |
            GIT_COMMIT_APP=${{ steps.meta.outputs.git_commit_app }}
            GIT_COMMIT_DEVOPS=${{ steps.meta.outputs.git_commit_devops }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}