image:
  registry: ghcr.io
  namespace: otulush/petclinic
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

services:
  - name: config-server
    port: 8888
    replicas: 1
    dependsOn: []

  - name: discovery-server
    port: 8761
    replicas: 1
    dependsOn:
      - name: config-server
        port: 8888

  - name: customers-service
    port: 8081
    replicas: 1
    dependsOn:
      - name: config-server
        port: 8888
      - name: discovery-server
        port: 8761

  - name: vets-service
    port: 8083
    replicas: 1
    dependsOn:
      - name: config-server
        port: 8888
      - name: discovery-server
        port: 8761

  - name: visits-service
    port: 8082
    replicas: 1
    dependsOn:
      - name: config-server
        port: 8888
      - name: discovery-server
        port: 8761

  - name: api-gateway
    port: 8080
    replicas: 1
    dependsOn:
      - name: config-server
        port: 8888
      - name: discovery-server
        port: 8761