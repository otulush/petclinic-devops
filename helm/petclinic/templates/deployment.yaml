{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      {{- if .dependsOn }}
      initContainers:
        {{- range .dependsOn }}
        - name: wait-for-{{ .name }}
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z {{ .name }} {{ .port }}; do echo waiting for {{ .name }}:{{ .port }}; sleep 2; done"
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.namespace }}-{{ .name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
          ports:
            - containerPort: {{ .port }}
          startupProbe:
            tcpSocket:
              port: {{ .port }}
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}